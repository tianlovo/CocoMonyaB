spring:
  application:
    name: "CocoMonyaB"
  
  # MongoDB 配置
  data:
    mongodb:
      # 运行模式：embedded（嵌入式）或 remote（远程）
      mode: embedded
      # 嵌入式 MongoDB 配置
      embedded:
        # MongoDB 版本号
        version: 7.0.12
        # MongoDB 监听端口
        port: 27017
        # MongoDB 绑定 IP 地址
        bind-ip: 127.0.0.1
        storage:
          # 数据存储目录
          directory: data/db/mongo
      # 远程 MongoDB 连接 URI（仅在 remote 模式下使用）
      # uri: mongodb://localhost:27017/cocomonya

  security: # 关闭默认的HTTP Basic认证，因为我们只做WebSocket token认证
    user:
      name: none
      password: none

server:
  port: 10721

# 日志配置
logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    "[it.tdlight.TDLight]": WARN

# Spring Dotenv 配置
springdotenv:
  directory: "data/config"
  filename: ".env"
  ignore-if-missing: false

# 应用配置
app:
  config-directory: "data/config"

# Telegram 配置
telegram:
  # 设备型号标识
  device-model: "Coco Monya"
  # TDLib 数据库存储目录
  database-directory: "data/session/td/data"
  # 文件下载目录
  download-directory: "data/session/td/downloads"
  # 登录超时时间（分钟），默认 2 分钟
  login-timeout-minutes: 2

# 环境变量配置（从 .env 文件读取）
env:
  # Telegram API ID（纯数字）
  api-id: ${API_ID}
  # Telegram API Hash（32位十六进制）
  api-hash: ${API_HASH}
  # 登录手机号（+国家代码+号码）
  tg-phone: ${TG_PHONE}
  # 两步验证密码（可选，如果未启用 2FA 则为空）
  tg-2fa: ${TG_2FA:}

# Websocket配置
websocket:
  trusted-token: ${WS_TRUSTED_TOKEN}
  connect-prefix: /ws
  app-dst-prefix: /app
  broker-prefix: /topic
  user-dst-prefix: /user
  heartbeat:
    incoming: 10000
    outgoing: 10000

# 并发安全性配置
concurrent-safety:
  # 媒体组配置
  media-group:
    # 媒体组超时时间（毫秒）- 超过此时间未收到新消息则触发处理
    timeout: 2000
    # 最大缓冲区大小 - 防止内存溢出
    max-buffer-size: 1000
  
  # 锁配置
  lock:
    # 分段锁数量（锁条带数）- 用于减少锁竞争，提高并发性能
    stripes: 128
    # 锁超时时间（毫秒）- 获取锁的最大等待时间
    timeout: 5000
  
  # 缓存配置
  cache:
    # 缓存过期时间（秒）- 消息去重缓存的有效期
    ttl: 10
    # 最大缓存大小 - 防止内存溢出
    max-size: 10000
    # 失败消息缓存时间（秒）- 处理失败的消息短暂缓存，防止立即重试
    failed-message-ttl: 5
