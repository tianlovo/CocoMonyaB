syntax = "proto3";

package org.xlyo.cocomonyab.websocket.heartbeat;

option java_package = "org.xlyo.cocomonyab.websocket.protobuf";
option java_outer_classname = "HeartbeatProtos";

// 心跳请求（客户端 -> 服务端）
message HeartbeatRequest {
  int64 client_timestamp = 1; // 客户端时间戳（毫秒）
  string client_id = 2;       // 客户端标识（可选，可用于区分不同实例）
}

// 心跳响应（服务端 -> 客户端）
message HeartbeatResponse {
  int64 server_timestamp = 1; // 服务端时间戳
  string status = 2;          // 状态，例如 "OK"
}