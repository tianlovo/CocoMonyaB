services:
  coco-api-ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: coco-api-ui:latest
    container_name: coco-api-ui
    ports:
      - "80:80"       # Vue前端
      - "15088:15088" # Node后端（固定端口）
    environment:
      - NODE_ENV=production
    volumes:
      # 挂载配置文件，方便修改配置
      - ./docker/config.yaml:/app/server/config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
