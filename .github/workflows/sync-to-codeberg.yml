name: Sync to Codeberg

on:
  push:
    branches:
      - '**'  # 推送到所有分支时触发
    tags:
      - '**'  # 推送标签时也触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取所有历史记录
          fetch-tags: true  # 获取所有标签

      - name: Configure Git
        run: |
          git config --global user.name "${{ vars.CODEBERG_USERNAME }}"
          git config --global user.email "${{ vars.CODEBERG_EMAIL }}"

      - name: Fetch all origin branches
        run: |
          # 获取origin远程的所有分支到本地
          echo "Fetching all branches from origin..."
          git fetch origin --prune
          # 创建本地分支跟踪所有远程分支
          for branch in $(git branch -r | grep -v '\->' | grep origin/ | sed 's/origin\///'); do
            git branch -f "$branch" "origin/$branch" || echo "Failed to create branch $branch"
          done

      - name: Add Codeberg remote
        run: |
          git remote add codeberg https://${{ vars.CODEBERG_USERNAME }}:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/${{ vars.CODEBERG_REPO_OWNER }}/${{ vars.CODEBERG_REPO_NAME }}.git || git remote set-url codeberg https://${{ vars.CODEBERG_USERNAME }}:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/${{ vars.CODEBERG_REPO_OWNER }}/${{ vars.CODEBERG_REPO_NAME }}.git

      - name: Fetch Codeberg branches
        run: |
          # 获取Codeberg远程的所有分支
          echo "Fetching all branches from Codeberg..."
          git fetch codeberg --prune || echo "Failed to fetch from Codeberg (repo may be empty), continuing..."

      - name: Ensure main is first push for empty repo
        run: |
          # 对于空仓库，先推送main分支作为第一个推送
          echo "Ensuring main branch is pushed first for empty Codeberg repository..."
          git push codeberg main:main || echo "Push failed (repo may not be empty), continuing..."

      - name: Push all branches to Codeberg
        run: |
          # 推送所有本地分支到Codeberg（不删除远程分支）
          echo "Pushing all branches to Codeberg..."
          git push codeberg --all --force

      - name: Push all tags to Codeberg
        run: |
          # 推送所有标签到Codeberg
          echo "Pushing all tags to Codeberg..."
          git push codeberg --tags --force